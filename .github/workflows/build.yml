name: Build and axiom audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Metadata and licence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - name: Validate formalization.yaml
        run: ruby scripts/validate-formalization.rb
      - name: Detect the repository licence
        run: |
          bundle exec licensee detect LICENSE --json --no-packages --no-readme > "$RUNNER_TEMP/license.json"
          ruby -rjson -e '
            report = JSON.parse(File.read(ARGV.fetch(0)))
            identifiers = report.fetch("licenses").map { |item| item.fetch("spdx_id") }
            abort "LICENSE is not detected exactly as Apache-2.0" unless identifiers == ["Apache-2.0"]
          ' "$RUNNER_TEMP/license.json"

  build:
    name: Build and audit axioms
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .
      - name: Check Lean source requirements
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
      - name: Axiom audit of the three main theorems
        run: |
          set -Eeuo pipefail
          lake env lean Axioms.lean | tee "$RUNNER_TEMP/axioms.txt"
          expected='depends on axioms: [propext, Classical.choice, Quot.sound]'
          for thm in potts_theorem_1_1 rc_theorem_1_2 rc_theorem_1_2_positivity_eq_1_3; do
            grep -qF "'PottsDiscontinuity.$thm' $expected" "$RUNNER_TEMP/axioms.txt" \
              || { echo "unexpected axioms for $thm"; exit 1; }
          done
          test "$(grep -c 'depends on axioms' "$RUNNER_TEMP/axioms.txt")" = 3
