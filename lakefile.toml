name = "PottsDiscontinuity"
version = "1.0.0"
defaultTargets = ["PottsDiscontinuity", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# Vendored copy of the five fixed-point-theorems modules used by the proof
# (Brouwer's fixed-point theorem), ported to the module system. MIT licence in
# vendor/fixed-point-theorems/LICENSE.
[[lean_lib]]
name = "FixedPointTheorems"
srcDir = "vendor/fixed-point-theorems"
globs = ["FixedPointTheorems.+"]

[[lean_lib]]
name = "PottsDiscontinuity"

# Statement surface (Mathlib only; proofs are deliberately `sorry`).
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

# Proved declarations; imports the proof development, never `Challenge`.
[[lean_lib]]
name = "Solution"
roots = ["Solution"]
