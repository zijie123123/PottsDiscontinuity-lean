automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
        - "claude-sonnet (version not recorded)"
        - "gpt-6-luna"
        - "gpt-6.1-sol"
        - "gpt-6-astra"
      framework: "Claude Code (orchestrator) with OpenAI Codex CLI proof workers and Claude Sonnet reviewer agents"
      tool_setup: >-
        Orchestrator-worker workflow based on the LeanAutoformalizationSkills repository
        (https://github.com/scottnarmstrong/LeanAutoformalizationSkills). The statements of the main
        theorems and of their 17 definitions were transcribed from the paper, audited by two
        independent reviewer agents, approved by the author and frozen before any proof work; a
        source-level proof dependency graph was extracted from the paper and reviewed; proof workers
        (up to ten in parallel, on disjoint files) proved graph nodes below the frozen statements;
        each sealed main theorem received an independent agent audit (statement fidelity, proof
        assembly, axioms). Builds used local Lean/Lake.
      cost:
        wall_time: "about two days of agent work (2026-10-18 to 2026-10-19), plus release preparation"
        spend_usd: "not tracked"
        hardware: "one local machine (18 cores, 64 GB RAM) and model APIs"
      prompting_notes: >-
        Each worker received a bounded brief: one target, the files it owns, the allowed
        dependencies, the validation commands and a stop condition. Frozen statements could not be
        changed; a worker that found a frozen statement or a source step wrong had to stop and report
        (several source-level gaps were found this way and repaired, see fidelity).
  spend_usd: "not tracked"
  notes: >-
    The author directed the work, approved the exact Lean statements and the representation choices
    (rulings R1-R10 in the README), and decided all scope questions. Proof search, proof writing and
    reviews were done by AI agents; the Lean kernel (and, for the submission, Comparator with
    independent kernels) checks the result.

fidelity:
  divergences: >-
    Representation choices (approved before proving; see the README): infinite-volume measures are
    limits along the boxes [-n, n]^2, weak convergence is convergence of all finite-dimensional
    cylinder probabilities, and the theorems assert existence of such limit measures with the stated
    properties (existence of the box limits, which the paper asserts without proof, is proved);
    beta_c and p_c are explicit values (criticality itself is not part of the theorems); Potts spins
    are Set.Icc 1 q and boundary conditions are Fin (q + 1) and Fin 2; ergodicity is invariance
    under all translations plus triviality of translation-invariant events; the alternating series is
    the limit of its ordered partial sums; Theorem 1.2 is split into two Lean theorems (items 1-3
    with (1.2), and positivity with (1.3)); finite volumes are induced subgraphs on finite vertex
    sets, with boundary the vertices having a neighbour outside. Lean's Real.log x is log |x|, so the
    limit statements in Theorem 1.1(3) and Theorem 1.2(3) do not by themselves assert positivity of
    the quantities inside the logarithm, which the paper's notation presupposes. Repairs of proof
    steps (statements unaffected), including: the event C in the proof of Lemma 3.15 is replaced by
    a corrected local connection event C' (the original implication "B and C imply U = 1" fails,
    e.g. for N = M = 8, n = 1); Lemma 3.14 is proved in a corrected limsup form with the additional
    input that the free one-arm probability on the rotated lattice tends to 0, which is proved
    separately from (3.24) and identity (4.4); the dominance of Lambda_0 over all sectors in
    Section 3.3 is proved separately; the identity Z(M) = Tr((V^[n]_infinity)^M) in the proof of
    Lemma 3.2 fails for r >= 2 and the conclusion is proved by another count; the endpoint Delta_0 in
    Corollary 3.4 is handled separately; the logarithmic singularity in (3.8) is handled by a
    truncation estimate; absence of percolation for the critical free measure (q > 4) is derived
    from the finite correlation length instead of Zhang's argument; misprints used by the proof are
    corrected (the relation between p_c and beta_c, the factor 1 - 1/q in the consequences of the
    Edwards-Sokal coupling), as are some proof steps of the companion paper.

