    its right-hand side, the identity (1.3) and the asymptotic equivalence as q decreases to 4), as
    the three Lean theorems PottsDiscontinuity.potts_theorem_1_1, PottsDiscontinuity.rc_theorem_1_2
    and PottsDiscontinuity.rc_theorem_1_2_positivity_eq_1_3, together with the intermediate results
    of the paper (and of the companion paper arXiv:1611.09909) on which their proofs rely, some in
    corrected form (see fidelity). Not formalized: that beta_c = log(1 + sqrt q) and
    p_c = sqrt(q) / (1 + sqrt q) are the critical points (they enter as explicit values), and
    convergence of the finite-volume measures along arbitrary exhaustions of the lattice (the
    infinite-volume measures are limits along the boxes [-n, n]^2).
