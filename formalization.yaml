version: "v0.4"

project:
  name: "Discontinuity of the phase transition for the planar random-cluster and Potts models with q > 4 (Theorems 1.1 and 1.2)"
  description: >-
    A complete Lean 4 / Mathlib formalization of Theorems 1.1 and 1.2 of Duminil-Copin, Gagnebin,
    Harel, Manolescu and Tassion (arXiv:1611.09877v2). For the q-state Potts model on the square
    lattice with q > 4, at beta_c = log(1 + sqrt q), the q + 1 box-limit Gibbs measures are distinct and
    ergodic, each monochromatic measure gives its own colour probability greater than 1/q at the
    origin, and the inverse correlation length in the diagonal direction is
    lambda + 2 sum_{k >= 1} (-1)^k tanh(k lambda) / k,
    where cosh lambda = sqrt(q) / 2, a positive number. For the random-cluster model on the square
    lattice with q > 4 at p_c = sqrt(q) / (1 + sqrt q), the free and wired box-limit measures differ,
    the wired measure has an infinite cluster almost surely, the free two-point function between 0
    and the diagonal site x_n decays at the same exact rate, and that rate equals
    sum_{k >= 0} 4 / ((2k + 1) sinh(pi^2 (2k + 1) / (2 lambda))), which is equivalent to
    8 exp(-pi^2 / sqrt(q - 4)) as q decreases to 4. The external results the paper cites and the
    proof uses (Edwards-Sokal coupling, FKG and comparison inequalities, finite energy, ergodicity
    and the 0-1 law for infinite clusters, planar self-duality, the coordinate Bethe ansatz of the
    companion paper arXiv:1611.09909, Perron-Frobenius, the analytic implicit function theorem) are
    proved or taken from Mathlib; uniqueness of the infinite cluster is not needed, and Brouwer's
    fixed-point theorem comes from a vendored library. The only axioms are propext,
    Classical.choice and Quot.sound.
  authors:
    - "Zijie Zhuang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Zijie Zhuang"

